<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>❤️ Aylanadigan yurak</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
let W,H,dpr,rot=0;
const colors=["#ff3030","#4da6ff","#fff","#ffe066","#ff69b4","#9b59ff","#00e676"];

function resize(){
 W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;
 c.width=W*dpr;c.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,W/2,H/2);
}
addEventListener("resize",resize);resize();

function heart(a){
 return {
  x:16*Math.sin(a)**3,
  y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))
 };
}

function draw(){
 ctx.fillStyle="#000";
 ctx.fillRect(-W/2,-H/2,W,H);

 const scale=Math.min(W,H)/36;
 ctx.save();
 ctx.rotate(rot);

 for(let i=0;i<120;i++){
  const a=2*Math.PI*i/120;
  const p=heart(a), x=p.x*scale, y=p.y*scale+20;

  ctx.strokeStyle=colors[i%colors.length];
  ctx.lineWidth=1;
  ctx.globalAlpha=.75;
  ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(x,y);ctx.stroke();

  for(let j=1;j<=8;j++){
   const q=j/9;
   ctx.fillStyle=colors[(i+j)%colors.length];
   ctx.globalAlpha=.9;
   ctx.beginPath();
   ctx.arc(x*q,20+(y-20)*q,2.2,0,Math.PI*2);
   ctx.fill();
  }

  ctx.fillStyle=colors[i%colors.length];
  ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();

 rot += 0.012;
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
